name: Sertec Flow - imagens OVH

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sertec-flow-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build ${{ matrix.image }}
    if: github.ref == 'refs/heads/preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - image: frontend
            context: .
            file: apps/web/Dockerfile.web
          - image: admin
            context: .
            file: apps/admin/Dockerfile.admin
          - image: space
            context: .
            file: apps/space/Dockerfile.space
          - image: live
            context: .
            file: apps/live/Dockerfile.live
          - image: backend
            context: apps/api
            file: apps/api/Dockerfile.api
          - image: proxy
            context: apps/proxy
            file: apps/proxy/Dockerfile.ce
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Identificar imagem
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Autenticar no GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=sertec-${{ matrix.image }}-amd64
          cache-to: type=gha,mode=min,scope=sertec-${{ matrix.image }}-amd64
          provenance: mode=min

      - name: Registrar imagem publicada
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          printf '### Imagem publicada\n\n`%s`\n\nDigest: `%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
